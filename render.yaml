# Free Render blueprint — ONE native Python web service.
# https://render.com/docs/free
#
# IMPORTANT: Delete every other cistron* service on the account first
# (cistron-api, cistron-ui, cistron-**** Docker). They are still linked to
# this repo and all redeploy + fail on every push.
#
# After deploy: open the single *.onrender.com URL.

services:
  - type: web
    name: cistron
    runtime: python
    plan: free
    buildCommand: bash scripts/render-build.sh
    startCommand: python -m uvicorn cistron.api.app:app --host 0.0.0.0 --port $PORT
    # Omit healthCheckPath on Free: cold import of numpy/scipy can exceed
    # the first health window and mark a working process as failed.
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: NODE_VERSION
        value: "22.16.0"
