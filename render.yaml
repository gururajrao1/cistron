# Free Render blueprint — ONE native Python web service (no Docker, no static site).
# https://render.com/docs/free
#
# Why one service:
#   - Docker web services are paid on Render
#   - Two-service API+static blueprints kept failing validation
#     (fromService host / sync:false prompts at create time)
#   - FastAPI already serves frontend/dist when present (same as Dockerfile)
#
# After deploy: open the single *.onrender.com URL (Studio + /api/v1/*).

services:
  - type: web
    name: cistron
    runtime: python
    plan: free
    buildCommand: bash scripts/render-build.sh
    startCommand: uvicorn cistron.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: NODE_VERSION
        value: "22.16.0"
